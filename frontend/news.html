<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>科技新闻列表 · 科技资讯站</title>
<!-- 姓名：蒋瑞龙 | 学号：24001010210 | 时间：2026-11-19 | 大模型：deepseek-flash -->
<meta name="description" content="科技资讯站 · 科技新闻列表页，数据来自 MySQL 的 Cheney_news 表">
<link rel="stylesheet" href="css/Cheney_style.css">
</head>
<body>
<header class="Cheney_topbar">
  <a class="Cheney_brand" href="index.html">
    <span class="Cheney_brand_mark">科</span>
    <span>科技资讯站 <span class="Cheney_brand_sub">/ 高级网页设计</span></span>
  </a>
  <a class="Cheney_backlink" href="index.html">← 返回首页</a>
</header>

<section class="Cheney_pagehead">
  <span class="Cheney_pagehead_kicker">NEWS · 01</span>
  <h1 class="Cheney_pagehead_title">科技新闻列表</h1>
  <p class="Cheney_pagehead_desc">数据存放在 MySQL 的 <code>Cheney_news</code> 表中，由后端 MVC 的 Model 层查询、Controller 层组织成统一 JSON 返回，前端用 fetch 取回后渲染成卡片。</p>
  <p class="Cheney_api">
    <span class="Cheney_api_label">接口地址</span>
    <a class="Cheney_api_url" id="Cheney_apiUrl" href="/api/news" target="_blank" rel="noopener">GET /api/news</a>
  </p>
</section>

<main class="Cheney_container">
  <div class="Cheney_toolbar">
    <p class="Cheney_count">共 <b id="Cheney_newsTotal">-</b> 条新闻 <span class="Cheney_hint">（接口返回数据同时输出到浏览器控制台）</span></p>
    <button class="Cheney_btn Cheney_btn_ghost" id="Cheney_newsRawBtn" type="button" aria-expanded="false">查看接口原始返回</button>
  </div>

  <pre class="Cheney_raw" id="Cheney_newsRaw" hidden></pre>

  <div class="Cheney_newsgrid" id="Cheney_newsGrid"></div>

  <div class="Cheney_state" id="Cheney_newsState">
    <span class="Cheney_spinner"></span>
    <span>正在请求 /api/news ...</span>
  </div>
</main>

<footer class="Cheney_footer_light">
  <span>姓名：蒋瑞龙 · 学号：24001010210</span>
  <span>科技资讯站 · 原生前端 + Express + MySQL</span>
</footer>

<script src="data/Cheney_newsData.js"></script>
<script src="js/Cheney_news.js"></script>
</body>
</html>
